services:
  neon-uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: gemini-neon-uploader
    restart: always
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/event_queue.db
    volumes:
      # 目录级挂载，避免文件不存在时权限问题
      - ./data:/app/data
    networks:
      - gemini-network

networks:
  gemini-network:
    name: gemini-network
    driver: bridge