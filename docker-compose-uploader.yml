services:
  neon-uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: gemini-neon-uploader
    restart: always
    user: "1001:1001"  # 👈 用上面 id 查到的值，冒号分隔
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/event_queue.db
    volumes:
      - ./data:/app/data
    networks:
      - gemini-network

networks:
  gemini-network:
    name: gemini-network
    driver: bridge
