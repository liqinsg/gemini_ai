[pytest]

minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    -q
    --strict-markers
    --cov=src/currency_strength
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=95

markers =
    unit: unit tests
    integration: integration tests
    regression: regression tests
    slow: slow tests

